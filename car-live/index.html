<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دهانات الجزيرة | BMW Live Dashboard</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;color:#111827;margin:0}.top{background:#050505;color:#fff;border-bottom:3px solid #078dcc;padding:18px 24px}.wrap{max-width:1200px;margin:auto;padding:26px 20px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.kpis,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:16px;box-shadow:0 8px 24px #1018280d}.label{font-size:12px;color:#667085}.value{font-size:24px;font-weight:900;margin-top:6px;direction:ltr;text-align:right}button{background:#078dcc;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;font-size:12px}th{color:#667085}.err{color:#b42318}.ok{color:#067647}.stamp{color:#667085;font-size:12px}@media(max-width:800px){.kpis,.cards{grid-template-columns:1fr}}</style></head><body><div class="top"><b>JAZEERA PAINTS</b> · حملة BMW</div><main class="wrap"><div class="head"><div><h1>حملة BMW — النتائج المباشرة</h1><div>من 9 أغسطس 2026 حتى اليوم · تحديث تلقائي كل 5 دقائق</div></div><div><span class="stamp" id="stamp">آخر تحديث: —</span> <button id="btn" onclick="loadAll()">تحديث الآن</button></div></div><div class="kpis"><div class="card"><div class="label">إجمالي الصرف USD</div><div class="value" id="spend">—</div></div><div class="card"><div class="label">Impressions</div><div class="value" id="imp">—</div></div><div class="card"><div class="label">Clicks / Actions</div><div class="value" id="clicks">—</div></div></div><div class="cards" id="cards"></div><table><thead><tr><th>Platform</th><th>Campaign</th><th>Spend USD</th><th>Impressions</th><th>Reach</th><th>Clicks/Actions</th><th>CTR</th><th>CPM</th><th>CPC</th></tr></thead><tbody id="rows"></tbody></table></main><script>const order=['Meta','Snapchat','TikTok','Google','Pinterest','X'];const n=v=>{let x=Number(String(v??'').replace(/[$,%\s,]/g,''));return Number.isFinite(x)?x:NaN};const norm=s=>String(s??'').toLowerCase().replace(/[_-]/g,' ').replace(/\s+/g,' ').trim();function ix(h,a){let z=h.map(norm);for(let q of a){let i=z.indexOf(norm(q));if(i>=0)return i}for(let q of a){let i=z.findIndex(v=>v.includes(norm(q)));if(i>=0)return i}return-1}function table(p){let c=[p?.data,p?.data?.data,p?.results,p?.result?.data,p];for(let x of c)if(Array.isArray(x)&&x.length&&Array.isArray(x[0]))return x;function w(o,d=0){if(!o||typeof o!=='object'||d>5)return null;for(let v of Object.values(o)){if(Array.isArray(v)&&v.length&&Array.isArray(v[0]))return v;let r=w(v,d+1);if(r)return r}return null}return w(p)}function parse(platform,p){let t=table(p);if(!t||t.length<2)throw Error('No data rows');let h=t[0].map(String),rs=t.slice(1);let ci=ix(h,['Campaign name','Campaign','Ad set name']),ui=ix(h,['Cost (USD)','Spend (USD)','Amount spent (USD)']),co=ix(h,['Cost','Spend','Amount spent']),cu=ix(h,['Currency','Advertiser currency','Account currency']),im=ix(h,['Impressions']),re=ix(h,['Reach']),ac=ix(h,platform==='Snapchat'?['Swipes','Clicks']:platform==='Pinterest'?['Outbound clicks','Pin clicks','Clicks']:platform==='X'?['Link clicks','Clicks']:['Link clicks','Clicks (all)','Clicks','Actions']);let spend=0,ims=0,reach=0,acts=0,hasR=false,camps=new Set;for(let r of rs){if(ci>=0&&r[ci])camps.add(String(r[ci]));let u=ui>=0?n(r[ui]):NaN;if(!Number.isFinite(u)&&co>=0){let c=n(r[co]);let cur=cu>=0?String(r[cu]).toUpperCase():'';if(Number.isFinite(c))u=cur.includes('SAR')?c/3.75:c}if(Number.isFinite(u))spend+=u;let v=im>=0?n(r[im]):NaN;if(Number.isFinite(v))ims+=v;v=re>=0?n(r[re]):NaN;if(Number.isFinite(v)&&v>0){reach+=v;hasR=true}v=ac>=0?n(r[ac]):NaN;if(Number.isFinite(v))acts+=v}return{platform,campaign:[...camps].join(' + ')||'—',spend,ims,reach:hasR?reach:NaN,acts,ctr:ims?acts/ims*100:NaN,cpm:ims?spend/ims*1000:NaN,cpc:acts?spend/acts:NaN}}const f=(x,d=0)=>Number.isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';async function loadAll(){btn.disabled=true;btn.textContent='جاري التحديث…';try{let r=await fetch('/api/data',{cache:'no-store'});let p=await r.json(),good=[],bad=[];for(let name of order){let s=p.sources?.[name];if(s?.ok){try{good.push(parse(name,s.data))}catch(e){bad.push([name,e.message])}}else bad.push([name,s?.error||'No data'])}cards.innerHTML=order.map(name=>{let d=good.find(x=>x.platform===name),e=bad.find(x=>x[0]===name);return d?`<div class="card"><b>${name}</b><div class="label">Spend</div><div class="value">$${f(d.spend,2)}</div><div class="label">Impressions ${f(d.ims)} · Actions ${f(d.acts)}</div></div>`:`<div class="card"><b>${name}</b><div class="err">${e?.[1]||'تعذر التحديث'}</div></div>`}).join('');rows.innerHTML=good.map(d=>`<tr><td>${d.platform}</td><td>${d.campaign}</td><td>$${f(d.spend,2)}</td><td>${f(d.ims)}</td><td>${f(d.reach)}</td><td>${f(d.acts)}</td><td>${f(d.ctr,3)}%</td><td>$${f(d.cpm,3)}</td><td>$${f(d.cpc,3)}</td></tr>`).join('');let s=good.reduce((a,d)=>a+d.spend,0),i=good.reduce((a,d)=>a+d.ims,0),c=good.reduce((a,d)=>a+d.acts,0);spend.textContent='$'+f(s,2);imp.textContent=f(i);clicks.textContent=f(c);stamp.textContent='آخر تحديث: '+new Date(p.updatedAt||Date.now()).toLocaleString('ar-SA')}catch(e){cards.innerHTML=`<div class="card err">تعذر الاتصال بالسيرفر: ${e.message}</div>`}finally{btn.disabled=false;btn.textContent='تحديث الآن'}}loadAll();setInterval(loadAll,300000)</script></body></html>
